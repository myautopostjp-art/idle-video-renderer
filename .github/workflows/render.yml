# =====================================================
# 放置動画自動レンダリング ワークフロー
# 配置場所: リポジトリの .github/workflows/render.yml
# =====================================================
name: Render Idle Video

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: '背景画像URL'
        required: true
      bgm_url:
        description: 'BGM URL'
        required: true
      duration:
        description: '動画の尺(秒)'
        required: false
        default: '3600'
  repository_dispatch:
    types: [render-video, render-video-weather, render-video-youtube-long, render-audio-preview, extract-last-frame, score-loop-seam]

permissions:
  contents: write

jobs:
  render:
    # 音声プレビューは別ジョブ(audio-preview)で処理するため、ここでは走らせない
    if: github.event.action != 'render-audio-preview' && github.event.action != 'extract-last-frame' && github.event.action != 'score-loop-seam'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python for Drive upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive upload dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Set parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "mode=${{ github.event.action }}" >> $GITHUB_OUTPUT
            echo "bgm_url=${{ github.event.client_payload.bgm_url }}" >> $GITHUB_OUTPUT
            echo "duration=${{ github.event.client_payload.duration || '3600' }}" >> $GITHUB_OUTPUT
            echo "${{ github.event.client_payload.top_text }}" > top.txt
            echo "${{ github.event.client_payload.bottom_text }}" > bottom.txt

            if [ "${{ github.event.action }}" = "render-video-weather" ]; then
              echo '${{ toJson(github.event.client_payload.image_urls) }}' > image_urls.json
            elif [ "${{ github.event.action }}" = "render-video-youtube-long" ]; then
              echo '${{ toJson(github.event.client_payload.image_urls) }}' > image_urls.json
              echo "intro_video_url=${{ github.event.client_payload.intro_video_url }}" >> $GITHUB_OUTPUT
              echo "intro_duration=${{ github.event.client_payload.intro_duration || '20' }}" >> $GITHUB_OUTPUT
              echo "ambient_sound_url=${{ github.event.client_payload.ambient_sound_url || 'none' }}" >> $GITHUB_OUTPUT
              echo "particle_key=${{ github.event.client_payload.particle_key || '' }}" >> $GITHUB_OUTPUT
              echo "transitions=${{ github.event.client_payload.transitions || '' }}" >> $GITHUB_OUTPUT
              # 効果音を立ち上げる位置(Geminiが導入部を見て判断した値)。
              # GitHubのclient_payloadは10項目までなので1つのJSON文字列にまとめてある。
              #
              # 【ヒアドキュメントを使わない理由】
              # YAMLのブロック内では終端行にもインデントが付いてしまい、
              # bashが終端と認識できず syntax error になる(実際に失敗した)。
              # jqでJSONとして書き出せば、引用符の扱いも安全になる。
              jq -n --argjson v '${{ toJson(github.event.client_payload.audio_timing) }}' '$v' > audio_timing_raw.json || echo '""' > audio_timing_raw.json
              jq -r '. // empty' audio_timing_raw.json > audio_timing.json || : 
            else
              echo "image_url=${{ github.event.client_payload.image_url }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=render-video" >> $GITHUB_OUTPUT
            echo "image_url=${{ inputs.image_url }}" >> $GITHUB_OUTPUT
            echo "bgm_url=${{ inputs.bgm_url }}" >> $GITHUB_OUTPUT
            echo "duration=${{ inputs.duration }}" >> $GITHUB_OUTPUT
            echo "" > top.txt
            echo "" > bottom.txt
          fi

          BGM_URL_VALUE="${{ github.event.client_payload.bgm_url || inputs.bgm_url }}"
          if [ -z "$BGM_URL_VALUE" ] || [ "$BGM_URL_VALUE" = "none" ]; then
            LABEL="silent"
          else
            LABEL="bgm"
          fi

          if [ "${{ github.event.action }}" = "render-video-youtube-long" ]; then
            LABEL="youtubelong"
          fi

          echo "tag=${LABEL}_video-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "label=${LABEL}" >> $GITHUB_OUTPUT

      # ============================================================
      # 効果音を立ち上げる位置を、導入部を見て決める
      #
      # 【なぜGitHub側でやるか】
      # GAS側で同じことを試したが、動画をメモリに読み込む時点で
      # 容量不足になった(50MBの送信上限とメモリ不足の両方に当たった)。
      # こちらはffmpegがあるので、480pxまで縮めてから渡せる。
      # データ量が数十分の一になり、制限に引っかからない。
      #
      # 【何を決めるか】
      # カメラワークは生成のたびに変わる。室内から歩き出す構図もあれば、
      # 最初から湯船のそばにいる構図もある。決め打ちの秒数では合わない。
      # 湯船が画面に現れる秒数を答えさせ、その手前から音を立ち上げる。
      # ============================================================
      - name: Decide audio timing with Gemini
        id: audiotiming
        if: ${{ steps.params.outputs.label == 'youtubelong' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTRO_VIDEO_URL: ${{ steps.params.outputs.intro_video_url }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] || [ -z "$INTRO_VIDEO_URL" ]; then
            echo "判断に必要な情報がないため、既定のタイミングを使います"
            exit 0
          fi

          # Driveの公開が反映される前だとHTMLが返るので、読めるまで待ち直す
          GOT=false
          for attempt in 1 2 3; do
            curl -fL -sS --retry 2 -o intro_for_check.mp4 "$INTRO_VIDEO_URL" 2>/dev/null || true
            if ffprobe -v error -show_entries format=duration -of csv=p=0 intro_for_check.mp4 >/dev/null 2>&1; then
              GOT=true; break
            fi
            echo "導入部がまだ読めません。10秒待ってやり直します(${attempt}/3)"
            sleep 10
          done
          if [ "$GOT" != true ]; then
            echo "導入部を取得できなかったため、既定のタイミングを使います"; exit 0
          fi

          # 480px・10fpsまで落とす。カメラの位置と湯船の登場を見るには十分で、
          # データ量は数十分の一になる
          ffmpeg -y -v error -i intro_for_check.mp4 -t 25 \
            -vf "scale=480:-2,fps=10" -an -c:v libx264 -preset veryfast -crf 32 \
            intro_small.mp4 2>/dev/null || {
            echo "縮小に失敗したため、既定のタイミングを使います"; exit 0; }

          ls -la intro_small.mp4

          cat << 'PYEOF' > decide_audio.py
          import os, json, base64, urllib.request

          api_key = os.environ['GEMINI_API_KEY']
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key={api_key}'

          with open('intro_small.mp4', 'rb') as f:
              data = base64.b64encode(f.read()).decode('utf-8')

          prompt = """旅館の導入部の動画です。このあと湯の流れる効果音を重ねます。
          その音をいつ立ち上げるべきかを判断してください。

          【見てほしいこと】
          1. 湯船や流れ落ちる湯が画面に現れるのは何秒あたりか
          2. 最初の時点で、カメラは湯船からどのくらい離れているか
             (室内の奥にいる / 戸口の近く / すでに湯船のそば)

          【決め方】
          openStart は、水が見え始める7〜8秒前にしてください。
          音は立ち上がりきるまでに時間がかかるため、
          見え始める直前から鳴らし始めると、満ちるのが遅れて感じられます。
          実際、4〜5秒前から立ち上げても「映像より遅れて聞こえる」と指摘された。
          水が画面に出た時点で、すでに音が完全に鳴りきっている状態が理想です。
          早すぎるぶんには不自然になりません(遠くの水音として自然に聞こえる)。

          farVolume は、水が見えていないあいだの音量です。
            カメラが室内の奥にいて湯船がまったく見えない → 0
            戸口の近くで、外の気配がある → 0.2
            最初から湯船が画面にある → 0.5

          openDuration は立ち上げにかける秒数です。
          長くすると音が満ちるのが遅れるので、短めを基本にしてください。
          カメラがゆっくり近づくなら4秒、一気に湯船が現れるなら2〜3秒。

          出力はJSONのみ:
          {"waterAppearsAt": 9, "openStart": 4, "openDuration": 4, "farVolume": 0, "reason": "理由を一文で"}
          説明文やマークダウンは含めないでください。"""

          payload = {
              'contents': [{'parts': [
                  {'inlineData': {'mimeType': 'video/mp4', 'data': data}},
                  {'text': prompt}
              ]}],
              'generationConfig': {'responseMimeType': 'application/json'}
          }

          result = None
          for attempt in (1, 2):
              req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'),
                                           headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=300) as res:
                      body = json.loads(res.read().decode('utf-8'))
                  text = next(p['text'] for p in body['candidates'][0]['content']['parts'] if 'text' in p)
                  result = json.loads(text)
                  break
              except Exception as e:
                  print(f'{attempt}回目に失敗しました:', e)
                  if attempt == 2:
                      raise SystemExit(0)

          if result is None:
              raise SystemExit(0)

          def num(v, lo, hi, default):
              try:
                  x = float(v)
              except (TypeError, ValueError):
                  return default
              return max(lo, min(hi, x))

          water = num(result.get('waterAppearsAt'), 0, 30, 9)
          dur = num(result.get('openDuration'), 2, 10, 5)
          start = num(result.get('openStart'), 0, 30, water - 5)
          far = num(result.get('farVolume'), 0, 1, 0)

          # 水が見えた時点で鳴りきっているように、必要なら前倒しする
          # さらに2秒の余裕を持たせる(遅れて聞こえるという指摘があったため)
          MARGIN = 2.0
          if start + dur > water - MARGIN:
              start = max(0, water - dur - MARGIN)

          print(f'水が現れるのは {water:.0f}秒あたり')
          print(f'音の立ち上げ: {start:.0f}秒から{dur:.0f}秒かけて')
          print(f'それまでの音量: {far}')
          if result.get('reason'):
              print('理由:', result['reason'])

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'open_start={start:.0f}\n')
              f.write(f'open_duration={dur:.0f}\n')
              f.write(f'far_volume={far}\n')
          PYEOF
          python3 decide_audio.py

      - name: Render video
        env:
          AMBIENT_SOUND_URL: ${{ steps.params.outputs.ambient_sound_url }}
          PARTICLE_KEY: ${{ steps.params.outputs.particle_key }}
          TRANSITIONS: ${{ steps.params.outputs.transitions }}
          # 効果音を立ち上げる位置(1つ前の工程でGeminiが判断した値)
          # 空ならレンダリング側が既定のタイミングを使う
          AUDIO_OPEN_START: ${{ steps.audiotiming.outputs.open_start }}
          AUDIO_OPEN_DURATION: ${{ steps.audiotiming.outputs.open_duration }}
          AUDIO_FAR_VOLUME: ${{ steps.audiotiming.outputs.far_volume }}
        run: |
          chmod +x render.sh
          if [ -f render_bgm_weather.sh ]; then chmod +x render_bgm_weather.sh; fi
          if [ -f render_youtube_long.sh ]; then chmod +x render_youtube_long.sh; fi

          if [ "${{ steps.params.outputs.mode }}" = "render-video-weather" ]; then
            IMAGE_URLS=$(jq -r '.[]' image_urls.json | tr '\n' ' ')
            ./render_bgm_weather.sh "${{ steps.params.outputs.bgm_url }}" output.mp4 top.txt bottom.txt $IMAGE_URLS
          elif [ "${{ steps.params.outputs.mode }}" = "render-video-youtube-long" ]; then
            IMAGE_URLS=$(jq -r '.[]' image_urls.json | tr '\n' ' ')
            # 効果音のタイミングを取り出す(空なら既定のタイミングで動く)
            #
            # カメラワークは生成のたびに変わるため、湯船が現れる秒数も変わる。
            # 決め打ちだと「画面で水が流れているのに無音」というずれが起きる。
            # Geminiが導入部を見て判断した値をここで受け取る。
            if [ -s audio_timing.json ] && jq -e . audio_timing.json >/dev/null 2>&1; then
              export AUDIO_OPEN_START=$(jq -r '.openStart // empty' audio_timing.json)
              export AUDIO_OPEN_DURATION=$(jq -r '.openDuration // empty' audio_timing.json)
              export AUDIO_FAR_VOLUME=$(jq -r '.farVolume // empty' audio_timing.json)
              echo "効果音のタイミングを受け取りました: ${AUDIO_OPEN_START}秒から${AUDIO_OPEN_DURATION}秒かけて(それまでの音量 ${AUDIO_FAR_VOLUME})"
            else
              echo "効果音のタイミング指定がないため、既定の位置で立ち上げます"
            fi
            ./render_youtube_long.sh "${{ steps.params.outputs.intro_video_url }}" "${{ steps.params.outputs.bgm_url }}" "${{ steps.params.outputs.duration }}" "${{ steps.params.outputs.intro_duration }}" output.mp4 $IMAGE_URLS
          else
            ./render.sh "${{ steps.params.outputs.image_url }}" "${{ steps.params.outputs.bgm_url }}" "${{ steps.params.outputs.duration }}" output.mp4 top.txt bottom.txt
          fi

      - name: Rename output with unique timestamped filename
        run: mv output.mp4 "${{ steps.params.outputs.tag }}.mp4"

      # GitHub Releaseへのアップロード(補助的な保存先)
      #
      # Releaseには2GBのサイズ上限があり、1時間の動画は超えることがある。
      # 本来の保存先はGoogle Driveなので、ここで失敗しても処理を止めない。
      # (以前はここで止まり、Driveへの保存まで実行されない事故が起きた)
      - name: Upload to Release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -c%s "${{ steps.params.outputs.tag }}.mp4")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "動画サイズ: ${SIZE_MB}MB"

          # 2GB(2147483648バイト)を超えるとReleaseが受け付けないため、事前に判定する
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "2GBを超えているためReleaseへのアップロードはスキップします(Driveには保存されます)"
            exit 0
          fi

          # 【修正】以前はTikTokのドメイン認証ファイルも一緒に添付していたが、
          # そのファイルがリポジトリ直下にないとコマンドごと失敗し、
          # continue-on-error で握りつぶされて video_url が空になっていた。
          # 認証ファイルはRelease経由で配る必要がないので添付をやめる。
          gh release create "${{ steps.params.outputs.tag }}" "${{ steps.params.outputs.tag }}.mp4" \
            --title "放置動画 ${{ steps.params.outputs.tag }}" \
            --notes "自動生成された動画"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.params.outputs.tag }}/${{ steps.params.outputs.tag }}.mp4"
          echo "video_url=$URL" >> $GITHUB_OUTPUT
          echo "動画URL: $URL"

      - name: Upload to Google Drive (OAuth)
        id: drive
        if: ${{ vars.GDRIVE_FOLDER_ID != '' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          FILE_PATH: ${{ steps.params.outputs.tag }}.mp4
          FILE_TAG: ${{ steps.params.outputs.tag }}
        run: |
          cat << 'EOF' > upload_to_drive.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          folder_id = os.environ['GDRIVE_FOLDER_ID']
          file_path = os.environ['FILE_PATH']
          file_tag = os.environ['FILE_TAG']

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )

          service = build('drive', 'v3', credentials=creds)

          file_metadata = {
              'name': f'{file_tag}.mp4',
              'parents': [folder_id]
          }
          media = MediaFileUpload(file_path, mimetype='video/mp4', resumable=True)
          uploaded = service.files().create(
              body=file_metadata, media_body=media, fields='id'
          ).execute()

          file_id = uploaded.get('id')
          service.permissions().create(
              fileId=file_id,
              body={'type': 'anyone', 'role': 'reader'}
          ).execute()

          drive_url = f'https://drive.google.com/uc?export=download&id={file_id}'
          print(f'Drive URL: {drive_url}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'drive_url={drive_url}\n')
          EOF
          python upload_to_drive.py

      - name: Upload BGM audio to Google Drive
        if: ${{ vars.GDRIVE_AUDIO_FOLDER_ID != '' && steps.params.outputs.label == 'bgm' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_AUDIO_FOLDER_ID: ${{ vars.GDRIVE_AUDIO_FOLDER_ID }}
          FILE_TAG: ${{ steps.params.outputs.tag }}
          BGM_URL: ${{ steps.params.outputs.bgm_url }}
        run: |
          cat << 'EOF' > upload_audio_to_drive.py
          import os
          import urllib.request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          bgm_url = os.environ.get('BGM_URL', '')
          if not bgm_url or bgm_url == 'none':
              print('BGM URLが空またはnoneのためスキップします')
              exit(0)

          folder_id = os.environ['GDRIVE_AUDIO_FOLDER_ID']
          file_tag = os.environ['FILE_TAG']
          audio_filename = f'{file_tag}.mp3'

          urllib.request.urlretrieve(bgm_url, audio_filename)

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )

          service = build('drive', 'v3', credentials=creds)

          file_metadata = {
              'name': audio_filename,
              'parents': [folder_id]
          }
          media = MediaFileUpload(audio_filename, mimetype='audio/mpeg', resumable=True)
          uploaded = service.files().create(
              body=file_metadata, media_body=media, fields='id'
          ).execute()

          file_id = uploaded.get('id')
          service.permissions().create(
              fileId=file_id,
              body={'type': 'anyone', 'role': 'reader'}
          ).execute()

          print(f'BGM音源をDriveに保存しました: https://drive.google.com/uc?export=download&id={file_id}')
          EOF
          python upload_audio_to_drive.py

      - name: Extract check frames from video
        if: ${{ steps.params.outputs.label != 'youtubelong' }}
        run: |
          # 動画から3枚のフレーム(開始・中間・終了付近)を抽出し、最終チェック用に保存する
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "${{ steps.params.outputs.tag }}.mp4")
          DURATION_INT=${DURATION%.*}
          MID=$((DURATION_INT / 2))
          NEAR_END=$((DURATION_INT - 5))
          if [ "$NEAR_END" -lt 0 ]; then NEAR_END=0; fi

          ffmpeg -y -ss 2 -i "${{ steps.params.outputs.tag }}.mp4" -frames:v 1 -q:v 2 check_frame_1.jpg
          ffmpeg -y -ss "$MID" -i "${{ steps.params.outputs.tag }}.mp4" -frames:v 1 -q:v 2 check_frame_2.jpg
          ffmpeg -y -ss "$NEAR_END" -i "${{ steps.params.outputs.tag }}.mp4" -frames:v 1 -q:v 2 check_frame_3.jpg
          echo "チェック用フレーム3枚を抽出しました"

      # ============================================================
      # YouTube長尺の完成動画をGeminiに見せて品質チェックする
      #
      # 1時間の動画をそのまま渡すことはできないため、
      # 要所(冒頭・導入部の終わり・段階の切り替わり・中盤)から短いクリップを切り出して渡す。
      # 「雨が止まって見える」「カメラが不自然に動く」といった、
      # 静止画では分からない問題を検出するのが狙い。
      # ============================================================
      - name: Check video quality with Gemini
        id: videocheck
        if: ${{ steps.params.outputs.label == 'youtubelong' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FILE_TAG: ${{ steps.params.outputs.tag }}
          INTRO_DURATION: ${{ github.event.client_payload.intro_duration || '20' }}
        run: |
          # APIキーが未設定ならスキップする
          # (if条件では secrets を参照できないため、ここで判定する)
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY が未設定のため、動画チェックをスキップします"
            exit 0
          fi

          VIDEO="${FILE_TAG}.mp4"
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          DURATION_INT=${DURATION%.*}

          # 切り出す位置を決める
          #   1. 導入部の全編 … カメラが動くのが正常。末尾に境目を含める
          #   2. ループの1周期 … カメラ固定が正常
          #
          # 2つ目はちょうど1周期を切り出す。
          # 半周期しか映らないと、ループの継ぎ目そのものが検品対象から外れてしまう。
          #
          # 【周期の求め方】
          #   クリップの生成秒数 ÷ LOOP_SPEED − XFADE_LOOP
          #   例: 20秒 ÷ 1.0 − 2秒 = 18秒
          #
          # render_youtube_long.sh は実際の周期を loop_period.txt に書き出すので、
          # そちらがあればそれを使う。無い場合だけ下の既定値を使う。
          # (LOOP_SPEED / XFADE_LOOP を変えたら、この既定値も直すこと)
          LOOP_PERIOD=6
          if [ -f loop_period.txt ]; then
            FILE_PERIOD=$(cat loop_period.txt | tr -d '[:space:]')
            if [ -n "$FILE_PERIOD" ] && [ "$FILE_PERIOD" -gt 0 ] 2>/dev/null; then
              LOOP_PERIOD="$FILE_PERIOD"
              echo "レンダリング側が記録した実際のループ周期を使います: ${LOOP_PERIOD}秒"
            fi
          fi

          # 【切り出し方を全面的に見直した】
          #
          # 以前は「導入部から6秒」「境目から6秒」「中盤から1周期」の3本だった。
          # しかしこれだと導入部の途中(9〜17秒あたり)を一度も見ておらず、
          # そこに破綻があっても報告されない。実際、目視で見つかった破綻を
          # 「問題は見つかりませんでした」と報告する取りこぼしが起きた。
          #
          # 【全部見る方が確実】
          # ループ部分は1周期をコピーして並べているので、
          # 1周期(18秒前後)を見れば全体を見たことになる。
          # 導入部も17秒程度しかない。つまり合計35秒ほど見れば全編を網羅できる。
          # 短く刻んで飛び飛びに見るより、通しで2本見る方が漏れがない。
          #
          # 【画質を上げた】
          # 480pxでは細かい歪みが潰れて見えない。640pxに上げる。
          # そのぶんクリップ数を3本から2本に減らしたので、
          # 送るデータ量は増えすぎない。
          MID=$((DURATION_INT / 2))
          # ループ周期の切れ目に合わせる(周期の途中から切ると継ぎ目の位置がずれるため)
          MID=$(( INTRO_DURATION + ((MID - INTRO_DURATION) / LOOP_PERIOD) * LOOP_PERIOD ))

          # 導入部は最初から、境目を少し越えるところまで通しで見る
          INTRO_LEN=$((INTRO_DURATION + 4))

          # ループは1周期。周期が短いと数秒で終わるため、最低10秒は確保する
          CLIP2_LEN=$LOOP_PERIOD
          if [ "$CLIP2_LEN" -lt 10 ]; then CLIP2_LEN=10; fi

          echo "動画チェック用のクリップを切り出します(全体${DURATION_INT}秒 / ループ周期${LOOP_PERIOD}秒)"
          echo "  1つ目: 0秒〜${INTRO_LEN}秒(導入部を通しで、境目まで)"
          echo "  2つ目: ${MID}秒〜(ループ部分・1周期分=${CLIP2_LEN}秒)"

          ffmpeg -y -ss 0 -i "$VIDEO" -t "$INTRO_LEN" -vf "scale=640:-2,fps=15" -an -c:v libx264 -preset veryfast -crf 28 clip_1.mp4 2>/dev/null
          ffmpeg -y -ss "$MID" -i "$VIDEO" -t "$CLIP2_LEN" -vf "scale=640:-2,fps=15" -an -c:v libx264 -preset veryfast -crf 28 clip_2.mp4 2>/dev/null
          ls -la clip_*.mp4

          cat << PYEOF > check_video.py
          import os, json, base64, urllib.request

          api_key = os.environ['GEMINI_API_KEY']
          # 【flash-lite ではなく flash を使う】
          # flash-lite は速くて安いが判断力が低く、目視で見つかる破綻を
          # 「問題なし」と報告した。時間をまたいで比べる判断には力不足。
          # flash に上げたところ、同じ動画から3箇所の破綻を言い当てた。
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key={api_key}'

          loop_period = ${LOOP_PERIOD}

          labels = ['導入部の全編(最後に境目を含む)', 'ループ部分の1周期']
          parts = []
          for i, label in enumerate(labels, start=1):
              path = f'clip_{i}.mp4'
              if not os.path.exists(path):
                  continue
              with open(path, 'rb') as f:
                  data = base64.b64encode(f.read()).decode('utf-8')
              parts.append({'text': f'--- {label} ---'})
              parts.append({'inlineData': {'mimeType': 'video/mp4', 'data': data}})

          if not parts:
              print('チェック対象のクリップがありません')
              raise SystemExit(0)

          prompt = """作業用・睡眠用BGM動画から切り出した2つの場面です。厳しく検品してください。

          【各場面の位置づけ】
          1つ目 = 導入部の全編。カメラが室内を歩いて外へ出ていく場面。
                  最後にループ部分への切り替わりが含まれる。

                  【この場面で最も注意して見てほしいこと】
                  これは同じ建物の中を移動する映像です。
                  最初と最後で、柱・梁・窓・床・照明の位置関係が繋がっているか
                  確認してください。途中で別の部屋に切り替わったように見えたら、
                  必ず報告してください。
                  例: 廊下を歩いていたのに、いつのまにか繋がっていない座敷にいる。

                  カメラが動くこと自体は正常です。しかし空間が入れ替わるのは異常です。
                  「カメラが動くのが正常」を理由に、繋がらない場面転換を
                  見逃さないでください。個々のコマが美しくても、
                  空間が繋がっていなければ不合格です。
          2つ目 = ループ部分。同じ約%d秒の映像を延々と繰り返す場面。
                  カメラは三脚に固定されているべきで、1ミリも動いてはいけない。

          【この2本で動画の全編を網羅しています】
          ループ部分は同じ映像の繰り返しなので、1周期に問題がなければ全体に問題がありません。
          逆に1周期に問題があれば、それが1時間ずっと繰り返されます。
          見落とすと視聴者が必ず気づくので、些細に思えることも報告してください。

          【特に見てほしい破綻】
          - 建物の柱・庇・岩などの輪郭が歪む、溶ける、途中で形が変わる
          - 画が一瞬飛ぶ、別の絵に切り替わる、ちらつく
          - 明るさや色が急に変わる
          - 物体の一部が消える、または不自然に現れる
          - 水面や湯気に不自然な模様、渦、貼りついたような動きがないか

          【最重要】2つ目のカメラ移動を厳しく見てください
          この場面は約%d秒ごとに同じ映像が繰り返されます。
          もしカメラがゆっくり動いていると、約%d秒ごとに元の位置へ戻る動きが生まれ、
          視聴者には「カクッと戻る」不自然な繰り返しとして見えてしまいます。
          そのため、ごくわずかな移動でも必ず報告してください。
          特に建物の柱や庇のような直線は、わずかなずれでも輪郭が二重に見えるため
          そこを重点的に確認してください。

          あわせて、ループの継ぎ目(末尾から先頭へ戻るところ)が滑らかに溶けているか、
          二重像や不自然な飛びがないかも確認してください。
          継ぎ目の前後で湯気や煙の量が急に増減していないかも見てください。

          最初のフレームと最後のフレームを見比べて、
          画面の端に写っているものの位置が変わっていないか確認してください。
          ゆっくりした平行移動(パン)、じわじわした拡大縮小(ズーム)、
          わずかな傾き、どれも見逃さないでください。
          動いていた場合は、どの方向にどの程度動いたかも書いてください。

          【空について】
          この動画では、空(星空・雲海)を意図的に静止させています。
          空が動いていないことは正常です。問題として報告しないでください。
          ただし、空と下の映像の境目に不自然な線や段差が見えたら報告してください。

          【その他の確認項目】
          - 雨・雪・炎・湯気・水面などが動いているか(静止画に貼りついたように止まっていないか)
          - 2つ目で情景だけが動き、カメラは止まっているか
          - コマ送りのようにカクついて見えないか(動きが滑らかか)
          - 場面の切り替わりが不自然でないか
          - 明るさは適切か(暗すぎて何も見えない、明るすぎて白飛びしていないか)
          - 映像に破綻がないか(物体の歪み、不自然な模様、画角の急変など)

          【判定の基準】
          「まあ許容範囲」と思えるものも、気づいた時点で報告してください。
          問題を見逃すより、多めに挙げてもらった方が助かります。
          本当に何ひとつ気になる点がない場合にのみ ok: true としてください。

          出力はJSONのみ:
          {"ok": true} または
          {"ok": false, "issues": ["具体的な指摘1", "具体的な指摘2"]}
          説明文やマークダウンは含めないでください。""" % (loop_period, loop_period, loop_period)

          parts.append({'text': prompt})

          payload = {
              'contents': [{'parts': parts}],
              'generationConfig': {'responseMimeType': 'application/json'}
          }

          # 【タイムアウト対策】
          # 動画3本の解析はGemini側で時間がかかる。待ち時間を540秒まで延ばし、
          # それでも落ちた場合は1度だけ作り直して再試行する。
          # (以前は180秒で毎回タイムアウトし、レビュー結果が常に空だった)
          result = None
          for attempt in (1, 2):
              req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'),
                                           headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=540) as res:
                      body = json.loads(res.read().decode('utf-8'))
                  text = next(p['text'] for p in body['candidates'][0]['content']['parts'] if 'text' in p)
                  result = json.loads(text)
                  break
              except Exception as e:
                  print(f'動画チェック {attempt}回目に失敗しました:', e)
                  if attempt == 2:
                      raise SystemExit(0)

          if result is None:
              raise SystemExit(0)

          if result.get('ok'):
              summary = '問題は見つかりませんでした'
          else:
              issues = result.get('issues', [])
              summary = '次の点が指摘されました: ' + ' / '.join(issues)

          print(summary)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'result={summary}\n')
          PYEOF
          python3 check_video.py

      - name: Upload check frames to Google Drive
        id: checkframes
        if: ${{ steps.params.outputs.label != 'youtubelong' && vars.GDRIVE_FOLDER_ID != '' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          FILE_TAG: ${{ steps.params.outputs.tag }}
        run: |
          cat << 'EOF' > upload_check_frames.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          folder_id = os.environ['GDRIVE_FOLDER_ID']
          file_tag = os.environ['FILE_TAG']

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          urls = []
          for i in range(1, 4):
              frame_path = f'check_frame_{i}.jpg'
              if not os.path.exists(frame_path):
                  continue
              file_metadata = {'name': f'{file_tag}_checkframe{i}.jpg', 'parents': [folder_id]}
              media = MediaFileUpload(frame_path, mimetype='image/jpeg', resumable=True)
              uploaded = service.files().create(body=file_metadata, media_body=media, fields='id').execute()
              file_id = uploaded.get('id')
              service.permissions().create(fileId=file_id, body={'type': 'anyone', 'role': 'reader'}).execute()
              urls.append(f'https://drive.google.com/uc?export=download&id={file_id}')

          import json
          urls_json = json.dumps(urls)
          print(f'チェックフレームURL: {urls_json}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'frame_urls={urls_json}\n')
          EOF
          python upload_check_frames.py

      - name: Notify GAS (完成通知)
        if: ${{ vars.GAS_WEBHOOK_URL != '' }}
        run: |
          DRIVE_URL="${{ steps.drive.outputs.drive_url }}"
          if [ -z "$DRIVE_URL" ]; then
            DRIVE_URL="${{ steps.release.outputs.video_url }}"
          fi
          VIDEO_TYPE="${{ steps.params.outputs.label }}"

          # BGM/YouTube長尺動画の場合は画像URLリストをJSON配列として渡す
          if [ -f image_urls.json ]; then
            IMAGE_URLS_JSON=$(cat image_urls.json)
          else
            IMAGE_URLS_JSON="[]"
          fi

          # 完成動画の最終チェック用フレームURL(なければ空配列)
          CHECK_FRAME_URLS='${{ steps.checkframes.outputs.frame_urls }}'
          if [ -z "$CHECK_FRAME_URLS" ]; then
            CHECK_FRAME_URLS="[]"
          fi

          # Geminiによる動画レビュー結果(YouTube長尺のみ。改行は|で連結されている)
          VIDEO_REVIEW='${{ steps.videocheck.outputs.result }}'

          # 使った素材を通知に載せる
          # (設定を戻しても結果が変わらないとき、素材の入れ替わりに
          #  すぐ気づけるようにするため)
          if [ -f used_sources.txt ]; then
            echo "--- この動画に使われた素材 ---"
            cat used_sources.txt
          fi

          # レンダリング側の検品で問題が見つかっていれば、それも伝える
          # (完成品を渡す前に気づけるようにするため)
          if [ -f quality_warning.txt ]; then
            WARN=$(cat quality_warning.txt | tr '\n' '/')
            VIDEO_REVIEW="【検品で問題あり】${WARN} ${VIDEO_REVIEW}"
            echo "※検品で問題が見つかっています: $WARN"
          fi

          curl -s -L -X POST "${{ vars.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"video_url": "'"$DRIVE_URL"'", "status": "succeeded", "already_saved_to_drive": true, "video_type": "'"$VIDEO_TYPE"'", "image_urls": '"$IMAGE_URLS_JSON"', "check_frame_urls": '"$CHECK_FRAME_URLS"', "video_review": "'"$VIDEO_REVIEW"'"}' || true

  # ============================================================
  # BGM + 効果音のミックス試聴版を作る
  #
  # 1時間の動画を作らずに音の相性だけを確認するためのジョブ。
  # 本番のレンダリングと同じEQ・音量・残響設定で2分間の音声を書き出し、
  # Driveに保存してメールで通知する。
  # ============================================================
  audio-preview:
    if: github.event.action == 'render-audio-preview'
    runs-on: ubuntu-latest
    # 音質評価(Audiobox Aesthetics)はPyTorchとモデルのダウンロードを伴うため、
    # 初回は10分近くかかることがある。余裕をみて30分にしている
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python for Drive upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive upload dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      # 音質の自動評価に使う(Meta Audiobox Aesthetics)
      # 人間の聴取評価と同等の精度が報告されている無料のオープンソースモデル
      # 初回はモデルのダウンロードが走るため数分かかる
      - name: Install audio quality assessment
        continue-on-error: true
        run: pip install audiobox_aesthetics

      - name: Mix audio
        id: mix
        run: |
          chmod +x render_audio_preview.sh
          ./render_audio_preview.sh \
            "${{ github.event.client_payload.bgm_url }}" \
            "${{ github.event.client_payload.ambient_sound_url }}" \
            "${{ github.event.client_payload.particle_key }}" \
            "${{ github.event.client_payload.duration || '120' }}"

          TAG="audiopreview_${{ github.event.client_payload.particle_key }}-$(date +%Y%m%d-%H%M%S)"
          mv audio_preview.mp3 "${TAG}.mp3"
          mv audio_preview_bgm_only.mp3 "${TAG}_bgm_only.mp3"
          # 音量違いの比較版(ファイル名に音量が入っている)
          for f in audio_preview_vol*.mp3; do
            [ -e "$f" ] || continue
            SUFFIX="${f#audio_preview_}"
            mv "$f" "${TAG}_${SUFFIX}"
          done
          ls -la ${TAG}*.mp3
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          # 音質スコアを改行なしの1行にして後続ステップへ渡す
          if [ -f score_summary.txt ]; then
            SCORE=$(cat score_summary.txt | tr '\n' '|')
            echo "score=${SCORE}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Google Drive
        id: drive
        if: ${{ vars.GDRIVE_AUDIO_FOLDER_ID != '' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_AUDIO_FOLDER_ID: ${{ vars.GDRIVE_AUDIO_FOLDER_ID }}
          FILE_TAG: ${{ steps.mix.outputs.tag }}
        run: |
          cat << 'EOF' > upload_preview.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          folder_id = os.environ['GDRIVE_AUDIO_FOLDER_ID']
          file_tag = os.environ['FILE_TAG']

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          urls = []
          import glob

          # 標準版・BGM単体に加え、音量違いの比較版もまとめてアップロードする
          targets = [f'{file_tag}.mp3', f'{file_tag}_bgm_only.mp3']
          targets += sorted(glob.glob(f'{file_tag}_vol*.mp3'))

          compare_urls = []
          for name in targets:
              if not os.path.exists(name):
                  continue
              media = MediaFileUpload(name, mimetype='audio/mpeg', resumable=True)
              uploaded = service.files().create(
                  body={'name': name, 'parents': [folder_id]},
                  media_body=media, fields='id'
              ).execute()
              fid = uploaded.get('id')
              service.permissions().create(
                  fileId=fid, body={'type': 'anyone', 'role': 'reader'}
              ).execute()
              url = f'https://drive.google.com/uc?export=download&id={fid}'
              urls.append(url)
              print(f'{name}: {url}')
              if '_vol' in name:
                  vol = name.split('_vol')[1].replace('.mp3', '')
                  compare_urls.append(f'音量{vol}: {url}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'mixed_url={urls[0] if len(urls) > 0 else ""}\n')
              f.write(f'bgm_only_url={urls[1] if len(urls) > 1 else ""}\n')
              f.write('compare_urls=' + '|'.join(compare_urls) + '\n')
          EOF
          python upload_preview.py

      - name: Notify GAS
        if: ${{ vars.GAS_WEBHOOK_URL != '' }}
        run: |
          curl -s -L -X POST "${{ vars.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "succeeded", "video_type": "audio-preview", "particle_key": "${{ github.event.client_payload.particle_key }}", "mixed_url": "${{ steps.drive.outputs.mixed_url }}", "bgm_only_url": "${{ steps.drive.outputs.bgm_only_url }}", "score": "${{ steps.mix.outputs.score }}", "compare_urls": "${{ steps.drive.outputs.compare_urls }}"}' || true

  # ============================================================
  # ループ候補の継ぎ目を採点する
  #
  # LTXは生成ごとにドリフト量が違うため、複数作って
  # 「最終フレームと最初のフレームの差」が最も小さいものを選ぶ。
  # 差が小さいほど、繰り返しても継ぎ目に気づかれにくい。
  #
  # ※ドリフト補正が効くようになったため、通常は候補1本で足りる。
  #   このジョブは候補を複数作ったときの保険として残してある。
  # ============================================================
  score-loop-seam:
    if: github.event.action == 'score-loop-seam'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil

      - name: Write scorer
        run: |
          printf '%s\n' \
            'import sys' \
            'from PIL import Image' \
            'i = sys.argv[1]' \
            'a = Image.open("f_" + i + ".png").convert("L")' \
            'b = Image.open("l_" + i + ".png").convert("L")' \
            'w, h = a.size' \
            'pts = [(x, y) for x in range(int(w*0.15), int(w*0.85), 4) for y in range(int(h*0.15), int(h*0.85), 4)]' \
            'd = [abs(a.getpixel(p) - b.getpixel(p)) for p in pts]' \
            'print("%.2f" % (sum(d)/len(d)))' \
            > scorer.py

      - name: Score each candidate
        run: |
          set -e
          echo '${{ toJson(github.event.client_payload.clip_urls) }}' > clips.json
          RESULTS='[]'
          COUNT=$(jq 'length' clips.json)
          echo "候補 ${COUNT}本を採点します"
          for i in $(seq 0 $((COUNT - 1))); do
            URL=$(jq -r ".[$i]" clips.json)
            echo "--- 候補$((i+1)) ---"
            if ! curl -sL --max-time 300 -o "cand_$i.mp4" "$URL"; then
              echo '  ダウンロードに失敗したため飛ばします'
              continue
            fi
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "cand_$i.mp4" || echo 0)
            if [ -z "$DUR" ] || [ "$DUR" = "0" ]; then echo '  尺が読めず飛ばします'; continue; fi
            LAST=$(awk "BEGIN{v=$DUR-0.1; if(v<0) v=0; printf \"%.2f\", v}")
            ffmpeg -v error -ss 0 -i "cand_$i.mp4" -frames:v 1 -vf scale=480:-2 -y "f_$i.png"
            ffmpeg -v error -ss "$LAST" -i "cand_$i.mp4" -frames:v 1 -vf scale=480:-2 -y "l_$i.png"
            SCORE=$(python3 scorer.py "$i")
            echo "  継ぎ目の差: $SCORE"
            RESULTS=$(echo "$RESULTS" | jq --arg u "$URL" --argjson s "$SCORE" '. + [{url:$u, score:$s}]')
          done
          echo "$RESULTS" > results.json
          jq -c . results.json

      - name: Notify GAS
        if: always()
        run: |
          if [ -n "${{ vars.GAS_WEBHOOK_URL }}" ]; then
            jq -n --argjson s "$(cat results.json 2>/dev/null || echo '[]')" \
                  --arg j '${{ github.event.client_payload.job_id }}' \
                  '{video_type:"loop-seam-score", job_id:$j, scores:$s}' > payload.json
            curl -sL -X POST -H 'Content-Type: application/json' \
                 -d @payload.json "${{ vars.GAS_WEBHOOK_URL }}" || true
          fi

  # ============================================================
  # 動画の最終フレームを画像として抜き出す
  #
  # 導入部の動画が終わる位置と、ループ動画が始まる位置を完全に一致させるために使う。
  #
  # LTXに「この画像で終われ」と指定しても、生成される最終フレームは
  # 指定した画像と完全には一致しない。そのため導入部とループのつなぎ目に
  # わずかなずれが生じてしまう。
  #
  # そこで導入部の実際の最終フレームを抜き出し、それを起点にループ動画を作る。
  # こうすれば両者は物理的に同じ画像から始まるため、ずれが原理的に発生しない。
  # ============================================================
  extract-last-frame:
    if: github.event.action == 'extract-last-frame'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python for Drive upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive upload dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Extract last frame
        id: extract
        run: |
          # 【読めるようになるまで待ってやり直す】
          # Driveに保存した直後の動画は、公開設定が外部から見えるように
          # なるまでに時間差がある。その間にダウンロードすると、
          # 動画ではなく警告ページのHTMLが返ってくる。
          # 実際に「moov atom not found」で失敗した。
          for attempt in 1 2 3 4 5; do
            curl -L -s -o source.mp4 "${{ github.event.client_payload.video_url }}"
            if ffprobe -v error -show_entries format=duration -of csv=p=0 source.mp4 >/dev/null 2>&1; then
              echo "動画を取得できました(${attempt}回目)"
              break
            fi
            SIZE=$(stat -c%s source.mp4 2>/dev/null || echo 0)
            echo "まだ動画として読めません(${SIZE}バイト)。15秒待ってやり直します(${attempt}/5)"
            head -c 200 source.mp4 || true
            echo ""
            if [ "$attempt" = "5" ]; then
              echo "5回試しても取得できませんでした"
              exit 1
            fi
            sleep 15
          done

          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 source.mp4)
          echo "動画の長さ: ${DURATION}秒"

          # 末尾から取り出す。完全な最後のフレームは崩れていることがあるため、
          # ほんのわずか手前(0.1秒前)を使う
          ffmpeg -y -sseof -0.1 -i source.mp4 -vframes 1 -q:v 2 last_frame.jpg

          # 抜き出せたか確認する
          if [ ! -s last_frame.jpg ]; then
            echo "末尾からの抽出に失敗したため、時間指定で再試行します"
            SEEK=$(awk "BEGIN{v=$DURATION-0.2; if(v<0) v=0; print v}")
            ffmpeg -y -ss "$SEEK" -i source.mp4 -vframes 1 -q:v 2 last_frame.jpg
          fi

          ls -la last_frame.jpg
          FRAME_TAG="lastframe-$(date +%Y%m%d-%H%M%S)"
          mv last_frame.jpg "${FRAME_TAG}.jpg"
          echo "tag=${FRAME_TAG}" >> $GITHUB_OUTPUT

      - name: Upload to Google Drive
        id: drive
        if: ${{ vars.GDRIVE_FOLDER_ID != '' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          FILE_TAG: ${{ steps.extract.outputs.tag }}
        run: |
          cat << 'EOF' > upload_frame.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          name = os.environ['FILE_TAG'] + '.jpg'
          media = MediaFileUpload(name, mimetype='image/jpeg', resumable=True)
          uploaded = service.files().create(
              body={'name': name, 'parents': [os.environ['GDRIVE_FOLDER_ID']]},
              media_body=media, fields='id'
          ).execute()
          fid = uploaded.get('id')
          service.permissions().create(
              fileId=fid, body={'type': 'anyone', 'role': 'reader'}
          ).execute()
          url = f'https://drive.google.com/uc?export=download&id={fid}'
          print('最終フレーム:', url)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'frame_url={url}\n')
          EOF
          python upload_frame.py

      - name: Notify GAS
        if: ${{ vars.GAS_WEBHOOK_URL != '' }}
        run: |
          curl -s -L -X POST "${{ vars.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "succeeded", "video_type": "last-frame", "frame_url": "${{ steps.drive.outputs.frame_url }}"}' || true
