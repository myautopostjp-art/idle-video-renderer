name: Render Idle Video

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: '背景画像URL'
        required: true
      bgm_url:
        description: 'BGM URL(無音の場合は none)'
        required: true
      duration:
        description: '動画の尺(秒)'
        required: false
        default: '3600'
      top_text:
        description: '上部に表示するテキスト'
        required: false
        default: ''
      bottom_text:
        description: '下部に表示するテキスト'
        required: false
        default: ''
  repository_dispatch:
    types: [render-video]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Japanese font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "image_url=${{ github.event.client_payload.image_url }}" >> $GITHUB_OUTPUT
            echo "bgm_url=${{ github.event.client_payload.bgm_url }}" >> $GITHUB_OUTPUT
            echo "duration=${{ github.event.client_payload.duration || '3600' }}" >> $GITHUB_OUTPUT
          else
            echo "image_url=${{ inputs.image_url }}" >> $GITHUB_OUTPUT
            echo "bgm_url=${{ inputs.bgm_url }}" >> $GITHUB_OUTPUT
            echo "duration=${{ inputs.duration }}" >> $GITHUB_OUTPUT
          fi
          echo "tag=video-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Write text files
        env:
          TOP_TEXT: ${{ github.event.client_payload.top_text || inputs.top_text }}
          BOTTOM_TEXT: ${{ github.event.client_payload.bottom_text || inputs.bottom_text }}
        run: |
          printf '%s' "$TOP_TEXT" > top.txt
          printf '%s' "$BOTTOM_TEXT" > bottom.txt

      - name: Render video
        run: |
          chmod +x render.sh
          ./render.sh "${{ steps.params.outputs.image_url }}" "${{ steps.params.outputs.bgm_url }}" "${{ steps.params.outputs.duration }}" output.mp4 top.txt bottom.txt

      - name: Upload to Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.params.outputs.tag }}" output.mp4 \
            --title "放置動画 ${{ steps.params.outputs.tag }}" \
            --notes "自動生成された動画"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.params.outputs.tag }}/output.mp4"
          echo "video_url=$URL" >> $GITHUB_OUTPUT
          echo "動画URL: $URL"

      - name: Notify GAS (完成通知)
        if: ${{ vars.GAS_WEBHOOK_URL != '' }}
        run: |
          echo "Webhook URL: ${{ vars.GAS_WEBHOOK_URL }}"
          RESPONSE=$(curl -s -L --post301 --post302 --post303 -X POST "${{ vars.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"video_url": "${{ steps.release.outputs.video_url }}", "status": "succeeded"}' \
            -w "\nHTTP_STATUS:%{http_code}")
          echo "$RESPONSE"
          echo "$RESPONSE" | tail -c 200
