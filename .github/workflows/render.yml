# =====================================================
# 放置動画自動レンダリング ワークフロー
# 配置場所: リポジトリの .github/workflows/render.yml
# =====================================================
name: Render Idle Video

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: '背景画像URL'
        required: true
      bgm_url:
        description: 'BGM URL'
        required: true
      duration:
        description: '動画の尺(秒)'
        required: false
        default: '3600'
  repository_dispatch:
    types: [render-video, render-video-weather, render-video-youtube-long, render-audio-preview, extract-last-frame]

permissions:
  contents: write

jobs:
  render:
    # 音声プレビューは別ジョブ(audio-preview)で処理するため、ここでは走らせない
    if: github.event.action != 'render-audio-preview' && github.event.action != 'extract-last-frame'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python for Drive upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive upload dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Set parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "mode=${{ github.event.action }}" >> $GITHUB_OUTPUT
            echo "bgm_url=${{ github.event.client_payload.bgm_url }}" >> $GITHUB_OUTPUT
            echo "duration=${{ github.event.client_payload.duration || '3600' }}" >> $GITHUB_OUTPUT
            echo "${{ github.event.client_payload.top_text }}" > top.txt
            echo "${{ github.event.client_payload.bottom_text }}" > bottom.txt

            if [ "${{ github.event.action }}" = "render-video-weather" ]; then
              echo '${{ toJson(github.event.client_payload.image_urls) }}' > image_urls.json
            elif [ "${{ github.event.action }}" = "render-video-youtube-long" ]; then
              echo '${{ toJson(github.event.client_payload.image_urls) }}' > image_urls.json
              echo "intro_video_url=${{ github.event.client_payload.intro_video_url }}" >> $GITHUB_OUTPUT
              echo "intro_duration=${{ github.event.client_payload.intro_duration || '20' }}" >> $GITHUB_OUTPUT
              echo "ambient_sound_url=${{ github.event.client_payload.ambient_sound_url || 'none' }}" >> $GITHUB_OUTPUT
              echo "particle_key=${{ github.event.client_payload.particle_key || '' }}" >> $GITHUB_OUTPUT
              echo "transitions=${{ github.event.client_payload.transitions || '' }}" >> $GITHUB_OUTPUT
              # レイヤー合成の情報(ベース静止画URL + 湯・空の領域)。
              # GitHubのclient_payloadは10項目までなので1つのJSON文字列にまとめてある。
              #
              # 【ヒアドキュメントを使わない理由】
              # YAMLのブロック内では終端行にもインデントが付いてしまい、
              # bashが終端と認識できず syntax error になる(実際に失敗した)。
              # jqでJSONとして書き出せば、引用符の扱いも安全になる。
              jq -n --argjson v '${{ toJson(github.event.client_payload.layer_info) }}' '$v' > layer_info_raw.json || echo '""' > layer_info_raw.json
              jq -r '. // empty' layer_info_raw.json > layer_info.json || : 
            else
              echo "image_url=${{ github.event.client_payload.image_url }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=render-video" >> $GITHUB_OUTPUT
            echo "image_url=${{ inputs.image_url }}" >> $GITHUB_OUTPUT
            echo "bgm_url=${{ inputs.bgm_url }}" >> $GITHUB_OUTPUT
            echo "duration=${{ inputs.duration }}" >> $GITHUB_OUTPUT
            echo "" > top.txt
            echo "" > bottom.txt
          fi

          BGM_URL_VALUE="${{ github.event.client_payload.bgm_url || inputs.bgm_url }}"
          if [ -z "$BGM_URL_VALUE" ] || [ "$BGM_URL_VALUE" = "none" ]; then
            LABEL="silent"
          else
            LABEL="bgm"
          fi

          if [ "${{ github.event.action }}" = "render-video-youtube-long" ]; then
            LABEL="youtubelong"
          fi

          echo "tag=${LABEL}_video-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "label=${LABEL}" >> $GITHUB_OUTPUT

      - name: Render video
        env:
          AMBIENT_SOUND_URL: ${{ steps.params.outputs.ambient_sound_url }}
          PARTICLE_KEY: ${{ steps.params.outputs.particle_key }}
          TRANSITIONS: ${{ steps.params.outputs.transitions }}
        run: |
          chmod +x render.sh
          if [ -f render_bgm_weather.sh ]; then chmod +x render_bgm_weather.sh; fi
          if [ -f render_youtube_long.sh ]; then chmod +x render_youtube_long.sh; fi

          if [ "${{ steps.params.outputs.mode }}" = "render-video-weather" ]; then
            IMAGE_URLS=$(jq -r '.[]' image_urls.json | tr '\n' ' ')
            ./render_bgm_weather.sh "${{ steps.params.outputs.bgm_url }}" output.mp4 top.txt bottom.txt $IMAGE_URLS
          elif [ "${{ steps.params.outputs.mode }}" = "render-video-youtube-long" ]; then
            IMAGE_URLS=$(jq -r '.[]' image_urls.json | tr '\n' ' ')
            # レイヤー合成用の情報を取り出す(空ならレイヤー合成なしで動く)
            if [ -s layer_info.json ] && jq -e . layer_info.json >/dev/null 2>&1; then
              export BASE_IMAGE_URL=$(jq -r '.base // empty' layer_info.json)
              export LAYER_REGIONS=$(jq -c '.regions // empty' layer_info.json)
              # 静止画に重ねる素材(湯の落下・湯気)
              export WATER_FALL_URL=$(jq -r '.materials.water_fall // empty' layer_info.json)
              export STEAM_URL=$(jq -r '.materials.steam // empty' layer_info.json)
              echo "レイヤー合成の情報を受け取りました"
            else
              echo "レイヤー合成の情報がないため、従来方式でレンダリングします"
            fi
            ./render_youtube_long.sh "${{ steps.params.outputs.intro_video_url }}" "${{ steps.params.outputs.bgm_url }}" "${{ steps.params.outputs.duration }}" "${{ steps.params.outputs.intro_duration }}" output.mp4 $IMAGE_URLS
          else
            ./render.sh "${{ steps.params.outputs.image_url }}" "${{ steps.params.outputs.bgm_url }}" "${{ steps.params.outputs.duration }}" output.mp4 top.txt bottom.txt
          fi

      - name: Rename output with unique timestamped filename
        run: mv output.mp4 "${{ steps.params.outputs.tag }}.mp4"

      # GitHub Releaseへのアップロード(補助的な保存先)
      #
      # Releaseには2GBのサイズ上限があり、1時間の動画は超えることがある。
      # 本来の保存先はGoogle Driveなので、ここで失敗しても処理を止めない。
      # (以前はここで止まり、Driveへの保存まで実行されない事故が起きた)
      - name: Upload to Release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -c%s "${{ steps.params.outputs.tag }}.mp4")
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "動画サイズ: ${SIZE_MB}MB"

          # 2GB(2147483648バイト)を超えるとReleaseが受け付けないため、事前に判定する
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "2GBを超えているためReleaseへのアップロードはスキップします(Driveには保存されます)"
            exit 0
          fi

          # 【修正】以前はTikTokのドメイン認証ファイルも一緒に添付していたが、
          # そのファイルがリポジトリ直下にないとコマンドごと失敗し、
          # continue-on-error で握りつぶされて video_url が空になっていた。
          # 認証ファイルはRelease経由で配る必要がないので添付をやめる。
          gh release create "${{ steps.params.outputs.tag }}" "${{ steps.params.outputs.tag }}.mp4" \
            --title "放置動画 ${{ steps.params.outputs.tag }}" \
            --notes "自動生成された動画"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.params.outputs.tag }}/${{ steps.params.outputs.tag }}.mp4"
          echo "video_url=$URL" >> $GITHUB_OUTPUT
          echo "動画URL: $URL"

      - name: Upload to Google Drive (OAuth)
        id: drive
        if: ${{ vars.GDRIVE_FOLDER_ID != '' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          FILE_PATH: ${{ steps.params.outputs.tag }}.mp4
          FILE_TAG: ${{ steps.params.outputs.tag }}
        run: |
          cat << 'EOF' > upload_to_drive.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          folder_id = os.environ['GDRIVE_FOLDER_ID']
          file_path = os.environ['FILE_PATH']
          file_tag = os.environ['FILE_TAG']

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )

          service = build('drive', 'v3', credentials=creds)

          file_metadata = {
              'name': f'{file_tag}.mp4',
              'parents': [folder_id]
          }
          media = MediaFileUpload(file_path, mimetype='video/mp4', resumable=True)
          uploaded = service.files().create(
              body=file_metadata, media_body=media, fields='id'
          ).execute()

          file_id = uploaded.get('id')
          service.permissions().create(
              fileId=file_id,
              body={'type': 'anyone', 'role': 'reader'}
          ).execute()

          drive_url = f'https://drive.google.com/uc?export=download&id={file_id}'
          print(f'Drive URL: {drive_url}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'drive_url={drive_url}\n')
          EOF
          python upload_to_drive.py

      - name: Upload BGM audio to Google Drive
        if: ${{ vars.GDRIVE_AUDIO_FOLDER_ID != '' && steps.params.outputs.label == 'bgm' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_AUDIO_FOLDER_ID: ${{ vars.GDRIVE_AUDIO_FOLDER_ID }}
          FILE_TAG: ${{ steps.params.outputs.tag }}
          BGM_URL: ${{ steps.params.outputs.bgm_url }}
        run: |
          cat << 'EOF' > upload_audio_to_drive.py
          import os
          import urllib.request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          bgm_url = os.environ.get('BGM_URL', '')
          if not bgm_url or bgm_url == 'none':
              print('BGM URLが空またはnoneのためスキップします')
              exit(0)

          folder_id = os.environ['GDRIVE_AUDIO_FOLDER_ID']
          file_tag = os.environ['FILE_TAG']
          audio_filename = f'{file_tag}.mp3'

          urllib.request.urlretrieve(bgm_url, audio_filename)

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )

          service = build('drive', 'v3', credentials=creds)

          file_metadata = {
              'name': audio_filename,
              'parents': [folder_id]
          }
          media = MediaFileUpload(audio_filename, mimetype='audio/mpeg', resumable=True)
          uploaded = service.files().create(
              body=file_metadata, media_body=media, fields='id'
          ).execute()

          file_id = uploaded.get('id')
          service.permissions().create(
              fileId=file_id,
              body={'type': 'anyone', 'role': 'reader'}
          ).execute()

          print(f'BGM音源をDriveに保存しました: https://drive.google.com/uc?export=download&id={file_id}')
          EOF
          python upload_audio_to_drive.py

      - name: Extract check frames from video
        if: ${{ steps.params.outputs.label != 'youtubelong' }}
        run: |
          # 動画から3枚のフレーム(開始・中間・終了付近)を抽出し、最終チェック用に保存する
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "${{ steps.params.outputs.tag }}.mp4")
          DURATION_INT=${DURATION%.*}
          MID=$((DURATION_INT / 2))
          NEAR_END=$((DURATION_INT - 5))
          if [ "$NEAR_END" -lt 0 ]; then NEAR_END=0; fi

          ffmpeg -y -ss 2 -i "${{ steps.params.outputs.tag }}.mp4" -frames:v 1 -q:v 2 check_frame_1.jpg
          ffmpeg -y -ss "$MID" -i "${{ steps.params.outputs.tag }}.mp4" -frames:v 1 -q:v 2 check_frame_2.jpg
          ffmpeg -y -ss "$NEAR_END" -i "${{ steps.params.outputs.tag }}.mp4" -frames:v 1 -q:v 2 check_frame_3.jpg
          echo "チェック用フレーム3枚を抽出しました"

      # ============================================================
      # YouTube長尺の完成動画をGeminiに見せて品質チェックする
      #
      # 1時間の動画をそのまま渡すことはできないため、
      # 要所(冒頭・導入部の終わり・段階の切り替わり・中盤)から短いクリップを切り出して渡す。
      # 「雨が止まって見える」「カメラが不自然に動く」といった、
      # 静止画では分からない問題を検出するのが狙い。
      # ============================================================
      - name: Check video quality with Gemini
        id: videocheck
        if: ${{ steps.params.outputs.label == 'youtubelong' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FILE_TAG: ${{ steps.params.outputs.tag }}
          INTRO_DURATION: ${{ github.event.client_payload.intro_duration || '20' }}
        run: |
          # APIキーが未設定ならスキップする
          # (if条件では secrets を参照できないため、ここで判定する)
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY が未設定のため、動画チェックをスキップします"
            exit 0
          fi

          VIDEO="${FILE_TAG}.mp4"
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          DURATION_INT=${DURATION%.*}

          # 切り出す位置を決める
          #   1. 冒頭        … 導入部のカメラワーク(動くのが正常)
          #   2. 導入部の終わり … ループへの切り替わり
          #   3. 中盤        … ループ部分(カメラ固定が正常)
          #
          # 【修正】3つ目はループのちょうど1周期を切り出す。
          # 以前は6秒だけ切り出していたが、実際の繰り返し周期は12秒なので
          # 半周期しか映らず、ループの継ぎ目そのものが検品対象から外れていた。
          #
          # 周期の内訳: クリップは6秒で生成 → 再生速度0.4倍で15.3秒 →
          #             シームレスループ加工で末尾3秒が先頭に溶けるため、繰り返し周期は約12秒
          # (render_youtube_long.sh の LOOP_SPEED / XFADE_LOOP を変えたらここも直すこと)
          LOOP_PERIOD=12

          INTRO_END=$((INTRO_DURATION - 3))
          if [ "$INTRO_END" -lt 0 ]; then INTRO_END=0; fi
          MID=$((DURATION_INT / 2))
          # ループ周期の切れ目に合わせる(周期の途中から切ると継ぎ目の位置がずれるため)
          MID=$(( INTRO_DURATION + ((MID - INTRO_DURATION) / LOOP_PERIOD) * LOOP_PERIOD ))

          echo "動画チェック用のクリップを切り出します(全体${DURATION_INT}秒 / ループ周期${LOOP_PERIOD}秒)"
          echo "  1つ目: 3秒〜(導入部) / 2つ目: ${INTRO_END}秒〜(境目) / 3つ目: ${MID}秒〜(ループ部分・1周期分)"
          # 【タイムアウト対策】
          # 以前は640pxで切り出していたが、3本をbase64で送るとGeminiの応答が
          # 180秒に間に合わず毎回失敗していた。
          # 480px・15fpsまで落とす。カメラの移動や雨の動きを見るには十分で、
          # データ量は半分以下になる。
          ffmpeg -y -ss 3 -i "$VIDEO" -t 6 -vf "scale=480:-2,fps=15" -an -c:v libx264 -preset veryfast -crf 30 clip_1.mp4 2>/dev/null
          ffmpeg -y -ss "$INTRO_END" -i "$VIDEO" -t 6 -vf "scale=480:-2,fps=15" -an -c:v libx264 -preset veryfast -crf 30 clip_2.mp4 2>/dev/null
          ffmpeg -y -ss "$MID" -i "$VIDEO" -t "$LOOP_PERIOD" -vf "scale=480:-2,fps=15" -an -c:v libx264 -preset veryfast -crf 30 clip_3.mp4 2>/dev/null
          ls -la clip_*.mp4

          cat << 'PYEOF' > check_video.py
          import os, json, base64, urllib.request

          api_key = os.environ['GEMINI_API_KEY']
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key={api_key}'

          labels = ['冒頭(導入部の動き)', '導入部からループへのつなぎ目', '中盤(ループ部分)']
          parts = []
          for i, label in enumerate(labels, start=1):
              path = f'clip_{i}.mp4'
              if not os.path.exists(path):
                  continue
              with open(path, 'rb') as f:
                  data = base64.b64encode(f.read()).decode('utf-8')
              parts.append({'text': f'--- {label} ---'})
              parts.append({'inlineData': {'mimeType': 'video/mp4', 'data': data}})

          if not parts:
              print('チェック対象のクリップがありません')
              raise SystemExit(0)

          prompt = """作業用・睡眠用BGM動画から切り出した3つの場面です。厳しく検品してください。

          【各場面の位置づけ】
          1つ目 = 導入部。カメラが室内を歩いて外へ出ていく場面。カメラが動くのが正常。
          2つ目 = 導入部からループ部分へ切り替わる境目。
          3つ目 = ループ部分。同じ約12秒の映像を延々と繰り返す場面。
                  切り出したのはちょうど1周期分なので、最初と最後がほぼ同じ画になっているはずです。
                  カメラは三脚に固定されているべきで、1ミリも動いてはいけない。

          【最重要】3つ目のカメラ移動を厳しく見てください
          この場面は約12秒ごとに同じ映像が繰り返されます。
          もしカメラがゆっくり動いていると、約12秒ごとに元の位置へ戻る動きが生まれ、
          視聴者には「カクッと戻る」不自然な繰り返しとして見えてしまいます。
          そのため、ごくわずかな移動でも必ず報告してください。
          特に建物の柱や庇のような直線は、わずかなずれでも輪郭が二重に見えるため
          そこを重点的に確認してください。

          あわせて、ループの継ぎ目(末尾から先頭へ戻るところ)が滑らかに溶けているか、
          二重像や不自然な飛びがないかも確認してください。

          最初のフレームと最後のフレームを見比べて、
          画面の端に写っているものの位置が変わっていないか確認してください。
          ゆっくりした平行移動(パン)、じわじわした拡大縮小(ズーム)、
          わずかな傾き、どれも見逃さないでください。
          動いていた場合は、どの方向にどの程度動いたかも書いてください。

          【その他の確認項目】
          - 雨・雪・炎・湯気・水面などが動いているか(静止画に貼りついたように止まっていないか)
          - 3つ目で情景だけが動き、カメラは止まっているか
          - 場面の切り替わりが不自然でないか
          - 明るさは適切か(暗すぎて何も見えない、明るすぎて白飛びしていないか)
          - 映像に破綻がないか(物体の歪み、不自然な模様、画角の急変など)

          【判定の基準】
          「まあ許容範囲」と思えるものも、気づいた時点で報告してください。
          問題を見逃すより、多めに挙げてもらった方が助かります。
          本当に何ひとつ気になる点がない場合にのみ ok: true としてください。

          出力はJSONのみ:
          {"ok": true} または
          {"ok": false, "issues": ["具体的な指摘1", "具体的な指摘2"]}
          説明文やマークダウンは含めないでください。"""

          parts.append({'text': prompt})

          payload = {
              'contents': [{'parts': parts}],
              'generationConfig': {'responseMimeType': 'application/json'}
          }

          # 【タイムアウト対策】
          # 動画3本の解析はGemini側で時間がかかる。待ち時間を540秒まで延ばし、
          # それでも落ちた場合は1度だけ作り直して再試行する。
          # (以前は180秒で毎回タイムアウトし、レビュー結果が常に空だった)
          result = None
          for attempt in (1, 2):
              req = urllib.request.Request(url, data=json.dumps(payload).encode('utf-8'),
                                           headers={'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=540) as res:
                      body = json.loads(res.read().decode('utf-8'))
                  text = next(p['text'] for p in body['candidates'][0]['content']['parts'] if 'text' in p)
                  result = json.loads(text)
                  break
              except Exception as e:
                  print(f'動画チェック {attempt}回目に失敗しました:', e)
                  if attempt == 2:
                      raise SystemExit(0)

          if result is None:
              raise SystemExit(0)

          if result.get('ok'):
              summary = '問題は見つかりませんでした'
          else:
              issues = result.get('issues', [])
              summary = '次の点が指摘されました: ' + ' / '.join(issues)

          print(summary)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'result={summary}\n')
          PYEOF
          python3 check_video.py

      - name: Upload check frames to Google Drive
        id: checkframes
        if: ${{ steps.params.outputs.label != 'youtubelong' && vars.GDRIVE_FOLDER_ID != '' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          FILE_TAG: ${{ steps.params.outputs.tag }}
        run: |
          cat << 'EOF' > upload_check_frames.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          folder_id = os.environ['GDRIVE_FOLDER_ID']
          file_tag = os.environ['FILE_TAG']

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          urls = []
          for i in range(1, 4):
              frame_path = f'check_frame_{i}.jpg'
              if not os.path.exists(frame_path):
                  continue
              file_metadata = {'name': f'{file_tag}_checkframe{i}.jpg', 'parents': [folder_id]}
              media = MediaFileUpload(frame_path, mimetype='image/jpeg', resumable=True)
              uploaded = service.files().create(body=file_metadata, media_body=media, fields='id').execute()
              file_id = uploaded.get('id')
              service.permissions().create(fileId=file_id, body={'type': 'anyone', 'role': 'reader'}).execute()
              urls.append(f'https://drive.google.com/uc?export=download&id={file_id}')

          import json
          urls_json = json.dumps(urls)
          print(f'チェックフレームURL: {urls_json}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'frame_urls={urls_json}\n')
          EOF
          python upload_check_frames.py

      # ============================================================
      # 完成した動画をGeminiに見せて品質を評価する(YouTube長尺のみ)
      #
      # 1時間の動画をそのまま渡すことはできないため、
      # 動きが確認できる短いクリップを数箇所から切り出して評価させる。
      # 「雨が止まっていないか」「カメラが不自然に動いていないか」など、
      # 静止画では分からない問題を検出することが目的。
      # ============================================================
      - name: Notify GAS (完成通知)
        if: ${{ vars.GAS_WEBHOOK_URL != '' }}
        run: |
          DRIVE_URL="${{ steps.drive.outputs.drive_url }}"
          if [ -z "$DRIVE_URL" ]; then
            DRIVE_URL="${{ steps.release.outputs.video_url }}"
          fi
          VIDEO_TYPE="${{ steps.params.outputs.label }}"

          # BGM/YouTube長尺動画の場合は画像URLリストをJSON配列として渡す
          if [ -f image_urls.json ]; then
            IMAGE_URLS_JSON=$(cat image_urls.json)
          else
            IMAGE_URLS_JSON="[]"
          fi

          # 完成動画の最終チェック用フレームURL(なければ空配列)
          CHECK_FRAME_URLS='${{ steps.checkframes.outputs.frame_urls }}'
          if [ -z "$CHECK_FRAME_URLS" ]; then
            CHECK_FRAME_URLS="[]"
          fi

          # Geminiによる動画レビュー結果(YouTube長尺のみ。改行は|で連結されている)
          VIDEO_REVIEW='${{ steps.videocheck.outputs.result }}'

          curl -s -L -X POST "${{ vars.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"video_url": "'"$DRIVE_URL"'", "status": "succeeded", "already_saved_to_drive": true, "video_type": "'"$VIDEO_TYPE"'", "image_urls": '"$IMAGE_URLS_JSON"', "check_frame_urls": '"$CHECK_FRAME_URLS"', "video_review": "'"$VIDEO_REVIEW"'"}' || true

  # ============================================================
  # BGM + 効果音のミックス試聴版を作る
  #
  # 1時間の動画を作らずに音の相性だけを確認するためのジョブ。
  # 本番のレンダリングと同じEQ・音量・残響設定で2分間の音声を書き出し、
  # Driveに保存してメールで通知する。
  # ============================================================
  audio-preview:
    if: github.event.action == 'render-audio-preview'
    runs-on: ubuntu-latest
    # 音質評価(Audiobox Aesthetics)はPyTorchとモデルのダウンロードを伴うため、
    # 初回は10分近くかかることがある。余裕をみて30分にしている
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python for Drive upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive upload dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      # 音質の自動評価に使う(Meta Audiobox Aesthetics)
      # 人間の聴取評価と同等の精度が報告されている無料のオープンソースモデル
      # 初回はモデルのダウンロードが走るため数分かかる
      - name: Install audio quality assessment
        continue-on-error: true
        run: pip install audiobox_aesthetics

      - name: Mix audio
        id: mix
        run: |
          chmod +x render_audio_preview.sh
          ./render_audio_preview.sh \
            "${{ github.event.client_payload.bgm_url }}" \
            "${{ github.event.client_payload.ambient_sound_url }}" \
            "${{ github.event.client_payload.particle_key }}" \
            "${{ github.event.client_payload.duration || '120' }}"

          TAG="audiopreview_${{ github.event.client_payload.particle_key }}-$(date +%Y%m%d-%H%M%S)"
          mv audio_preview.mp3 "${TAG}.mp3"
          mv audio_preview_bgm_only.mp3 "${TAG}_bgm_only.mp3"
          # 音量違いの比較版(ファイル名に音量が入っている)
          for f in audio_preview_vol*.mp3; do
            [ -e "$f" ] || continue
            SUFFIX="${f#audio_preview_}"
            mv "$f" "${TAG}_${SUFFIX}"
          done
          ls -la ${TAG}*.mp3
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          # 音質スコアを改行なしの1行にして後続ステップへ渡す
          if [ -f score_summary.txt ]; then
            SCORE=$(cat score_summary.txt | tr '\n' '|')
            echo "score=${SCORE}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Google Drive
        id: drive
        if: ${{ vars.GDRIVE_AUDIO_FOLDER_ID != '' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_AUDIO_FOLDER_ID: ${{ vars.GDRIVE_AUDIO_FOLDER_ID }}
          FILE_TAG: ${{ steps.mix.outputs.tag }}
        run: |
          cat << 'EOF' > upload_preview.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          folder_id = os.environ['GDRIVE_AUDIO_FOLDER_ID']
          file_tag = os.environ['FILE_TAG']

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          urls = []
          import glob

          # 標準版・BGM単体に加え、音量違いの比較版もまとめてアップロードする
          targets = [f'{file_tag}.mp3', f'{file_tag}_bgm_only.mp3']
          targets += sorted(glob.glob(f'{file_tag}_vol*.mp3'))

          compare_urls = []
          for name in targets:
              if not os.path.exists(name):
                  continue
              media = MediaFileUpload(name, mimetype='audio/mpeg', resumable=True)
              uploaded = service.files().create(
                  body={'name': name, 'parents': [folder_id]},
                  media_body=media, fields='id'
              ).execute()
              fid = uploaded.get('id')
              service.permissions().create(
                  fileId=fid, body={'type': 'anyone', 'role': 'reader'}
              ).execute()
              url = f'https://drive.google.com/uc?export=download&id={fid}'
              urls.append(url)
              print(f'{name}: {url}')
              if '_vol' in name:
                  vol = name.split('_vol')[1].replace('.mp3', '')
                  compare_urls.append(f'音量{vol}: {url}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'mixed_url={urls[0] if len(urls) > 0 else ""}\n')
              f.write(f'bgm_only_url={urls[1] if len(urls) > 1 else ""}\n')
              f.write('compare_urls=' + '|'.join(compare_urls) + '\n')
          EOF
          python upload_preview.py

      - name: Notify GAS
        if: ${{ vars.GAS_WEBHOOK_URL != '' }}
        run: |
          curl -s -L -X POST "${{ vars.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "succeeded", "video_type": "audio-preview", "particle_key": "${{ github.event.client_payload.particle_key }}", "mixed_url": "${{ steps.drive.outputs.mixed_url }}", "bgm_only_url": "${{ steps.drive.outputs.bgm_only_url }}", "score": "${{ steps.mix.outputs.score }}", "compare_urls": "${{ steps.drive.outputs.compare_urls }}"}' || true

  # ============================================================
  # 動画の最終フレームを画像として抜き出す
  #
  # 導入部の動画が終わる位置と、ループ動画が始まる位置を完全に一致させるために使う。
  #
  # LTXに「この画像で終われ」と指定しても、生成される最終フレームは
  # 指定した画像と完全には一致しない。そのため導入部とループのつなぎ目に
  # わずかなずれが生じてしまう。
  #
  # そこで導入部の実際の最終フレームを抜き出し、それを起点にループ動画を作る。
  # こうすれば両者は物理的に同じ画像から始まるため、ずれが原理的に発生しない。
  # ============================================================
  extract-last-frame:
    if: github.event.action == 'extract-last-frame'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python for Drive upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive upload dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Extract last frame
        id: extract
        run: |
          curl -L -s -o source.mp4 "${{ github.event.client_payload.video_url }}"

          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 source.mp4)
          echo "動画の長さ: ${DURATION}秒"

          # 末尾から取り出す。完全な最後のフレームは崩れていることがあるため、
          # ほんのわずか手前(0.1秒前)を使う
          ffmpeg -y -sseof -0.1 -i source.mp4 -vframes 1 -q:v 2 last_frame.jpg

          # 抜き出せたか確認する
          if [ ! -s last_frame.jpg ]; then
            echo "末尾からの抽出に失敗したため、時間指定で再試行します"
            SEEK=$(awk "BEGIN{v=$DURATION-0.2; if(v<0) v=0; print v}")
            ffmpeg -y -ss "$SEEK" -i source.mp4 -vframes 1 -q:v 2 last_frame.jpg
          fi

          ls -la last_frame.jpg
          FRAME_TAG="lastframe-$(date +%Y%m%d-%H%M%S)"
          mv last_frame.jpg "${FRAME_TAG}.jpg"
          echo "tag=${FRAME_TAG}" >> $GITHUB_OUTPUT

      - name: Upload to Google Drive
        id: drive
        if: ${{ vars.GDRIVE_FOLDER_ID != '' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          FILE_TAG: ${{ steps.extract.outputs.tag }}
        run: |
          cat << 'EOF' > upload_frame.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          name = os.environ['FILE_TAG'] + '.jpg'
          media = MediaFileUpload(name, mimetype='image/jpeg', resumable=True)
          uploaded = service.files().create(
              body={'name': name, 'parents': [os.environ['GDRIVE_FOLDER_ID']]},
              media_body=media, fields='id'
          ).execute()
          fid = uploaded.get('id')
          service.permissions().create(
              fileId=fid, body={'type': 'anyone', 'role': 'reader'}
          ).execute()
          url = f'https://drive.google.com/uc?export=download&id={fid}'
          print('最終フレーム:', url)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'frame_url={url}\n')
          EOF
          python upload_frame.py

      - name: Notify GAS
        if: ${{ vars.GAS_WEBHOOK_URL != '' }}
        run: |
          curl -s -L -X POST "${{ vars.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"status": "succeeded", "video_type": "last-frame", "frame_url": "${{ steps.drive.outputs.frame_url }}"}' || true
