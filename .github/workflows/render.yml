# =====================================================
# 放置動画自動レンダリング ワークフロー
# 配置場所: リポジトリの .github/workflows/render.yml
# =====================================================
name: Render Idle Video

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: '背景画像URL'
        required: true
      bgm_url:
        description: 'BGM URL'
        required: true
      duration:
        description: '動画の尺(秒)'
        required: false
        default: '3600'
  repository_dispatch:
    types: [render-video, render-video-weather, render-video-youtube-long]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python for Drive upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive upload dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Set parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "mode=${{ github.event.action }}" >> $GITHUB_OUTPUT
            echo "bgm_url=${{ github.event.client_payload.bgm_url }}" >> $GITHUB_OUTPUT
            echo "duration=${{ github.event.client_payload.duration || '3600' }}" >> $GITHUB_OUTPUT
            echo "${{ github.event.client_payload.top_text }}" > top.txt
            echo "${{ github.event.client_payload.bottom_text }}" > bottom.txt

            if [ "${{ github.event.action }}" = "render-video-weather" ]; then
              echo '${{ toJson(github.event.client_payload.image_urls) }}' > image_urls.json
            elif [ "${{ github.event.action }}" = "render-video-youtube-long" ]; then
              echo '${{ toJson(github.event.client_payload.image_urls) }}' > image_urls.json
              echo "intro_video_url=${{ github.event.client_payload.intro_video_url }}" >> $GITHUB_OUTPUT
              echo "intro_duration=${{ github.event.client_payload.intro_duration || '20' }}" >> $GITHUB_OUTPUT
              echo "theme_name=${{ github.event.client_payload.theme_name }}" >> $GITHUB_OUTPUT
            else
              echo "image_url=${{ github.event.client_payload.image_url }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=render-video" >> $GITHUB_OUTPUT
            echo "image_url=${{ inputs.image_url }}" >> $GITHUB_OUTPUT
            echo "bgm_url=${{ inputs.bgm_url }}" >> $GITHUB_OUTPUT
            echo "duration=${{ inputs.duration }}" >> $GITHUB_OUTPUT
            echo "" > top.txt
            echo "" > bottom.txt
          fi

          BGM_URL_VALUE="${{ github.event.client_payload.bgm_url || inputs.bgm_url }}"
          if [ -z "$BGM_URL_VALUE" ] || [ "$BGM_URL_VALUE" = "none" ]; then
            LABEL="silent"
          else
            LABEL="bgm"
          fi

          if [ "${{ github.event.action }}" = "render-video-youtube-long" ]; then
            LABEL="youtubelong"
          fi

          echo "tag=${LABEL}_video-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "label=${LABEL}" >> $GITHUB_OUTPUT

      - name: Render video
        run: |
          chmod +x render.sh
          if [ -f render_bgm_weather.sh ]; then chmod +x render_bgm_weather.sh; fi
          if [ -f render_youtube_long.sh ]; then chmod +x render_youtube_long.sh; fi

          if [ "${{ steps.params.outputs.mode }}" = "render-video-weather" ]; then
            IMAGE_URLS=$(jq -r '.[]' image_urls.json | tr '\n' ' ')
            ./render_bgm_weather.sh "${{ steps.params.outputs.bgm_url }}" output.mp4 top.txt bottom.txt $IMAGE_URLS
          elif [ "${{ steps.params.outputs.mode }}" = "render-video-youtube-long" ]; then
            IMAGE_URLS=$(jq -r '.[]' image_urls.json | tr '\n' ' ')
            ./render_youtube_long.sh "${{ steps.params.outputs.intro_video_url }}" "${{ steps.params.outputs.bgm_url }}" "${{ steps.params.outputs.duration }}" "${{ steps.params.outputs.intro_duration }}" output.mp4 $IMAGE_URLS
          else
            ./render.sh "${{ steps.params.outputs.image_url }}" "${{ steps.params.outputs.bgm_url }}" "${{ steps.params.outputs.duration }}" output.mp4 top.txt bottom.txt
          fi

      - name: Rename output with unique timestamped filename
        run: mv output.mp4 "${{ steps.params.outputs.tag }}.mp4"

      - name: Upload to Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.params.outputs.tag }}" "${{ steps.params.outputs.tag }}.mp4" tiktokqKDPIBl5H1NvLbGlMCi1MU6K3bKB5wb9.txt \
            --title "放置動画 ${{ steps.params.outputs.tag }}" \
            --notes "自動生成された動画"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.params.outputs.tag }}/${{ steps.params.outputs.tag }}.mp4"
          echo "video_url=$URL" >> $GITHUB_OUTPUT
          echo "動画URL: $URL"

      - name: Upload to Google Drive (OAuth)
        id: drive
        if: ${{ vars.GDRIVE_FOLDER_ID != '' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          FILE_PATH: ${{ steps.params.outputs.tag }}.mp4
          FILE_TAG: ${{ steps.params.outputs.tag }}
        run: |
          cat << 'EOF' > upload_to_drive.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          folder_id = os.environ['GDRIVE_FOLDER_ID']
          file_path = os.environ['FILE_PATH']
          file_tag = os.environ['FILE_TAG']

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )

          service = build('drive', 'v3', credentials=creds)

          file_metadata = {
              'name': f'{file_tag}.mp4',
              'parents': [folder_id]
          }
          media = MediaFileUpload(file_path, mimetype='video/mp4', resumable=True)
          uploaded = service.files().create(
              body=file_metadata, media_body=media, fields='id'
          ).execute()

          file_id = uploaded.get('id')
          service.permissions().create(
              fileId=file_id,
              body={'type': 'anyone', 'role': 'reader'}
          ).execute()

          drive_url = f'https://drive.google.com/uc?export=download&id={file_id}'
          print(f'Drive URL: {drive_url}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'drive_url={drive_url}\n')
          EOF
          python upload_to_drive.py

      - name: Upload BGM audio to Google Drive
        if: ${{ vars.GDRIVE_AUDIO_FOLDER_ID != '' && steps.params.outputs.label == 'bgm' }}
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_AUDIO_FOLDER_ID: ${{ vars.GDRIVE_AUDIO_FOLDER_ID }}
          FILE_TAG: ${{ steps.params.outputs.tag }}
          BGM_URL: ${{ steps.params.outputs.bgm_url }}
        run: |
          cat << 'EOF' > upload_audio_to_drive.py
          import os
          import urllib.request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          bgm_url = os.environ.get('BGM_URL', '')
          if not bgm_url or bgm_url == 'none':
              print('BGM URLが空またはnoneのためスキップします')
              exit(0)

          folder_id = os.environ['GDRIVE_AUDIO_FOLDER_ID']
          file_tag = os.environ['FILE_TAG']
          audio_filename = f'{file_tag}.mp3'

          urllib.request.urlretrieve(bgm_url, audio_filename)

          creds = Credentials(
              token=None,
              refresh_token=os.environ['GDRIVE_REFRESH_TOKEN'],
              client_id=os.environ['GDRIVE_CLIENT_ID'],
              client_secret=os.environ['GDRIVE_CLIENT_SECRET'],
              token_uri='https://oauth2.googleapis.com/token',
              scopes=['https://www.googleapis.com/auth/drive']
          )

          service = build('drive', 'v3', credentials=creds)

          file_metadata = {
              'name': audio_filename,
              'parents': [folder_id]
          }
          media = MediaFileUpload(audio_filename, mimetype='audio/mpeg', resumable=True)
          uploaded = service.files().create(
              body=file_metadata, media_body=media, fields='id'
          ).execute()

          file_id = uploaded.get('id')
          service.permissions().create(
              fileId=file_id,
              body={'type': 'anyone', 'role': 'reader'}
          ).execute()

          print(f'BGM音源をDriveに保存しました: https://drive.google.com/uc?export=download&id={file_id}')
          EOF
          python upload_audio_to_drive.py

      - name: Notify GAS (完成通知)
        if: ${{ vars.GAS_WEBHOOK_URL != '' }}
        run: |
          DRIVE_URL="${{ steps.drive.outputs.drive_url }}"
          if [ -z "$DRIVE_URL" ]; then
            DRIVE_URL="${{ steps.release.outputs.video_url }}"
          fi
          VIDEO_TYPE="${{ steps.params.outputs.label }}"

          # BGM/YouTube長尺動画の場合は画像URLリストをJSON配列として渡す
          if [ -f image_urls.json ]; then
            IMAGE_URLS_JSON=$(cat image_urls.json)
          else
            IMAGE_URLS_JSON="[]"
          fi

          curl -s -L -X POST "${{ vars.GAS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"video_url": "'"$DRIVE_URL"'", "status": "succeeded", "already_saved_to_drive": true, "video_type": "'"$VIDEO_TYPE"'", "image_urls": '"$IMAGE_URLS_JSON"'}' || true
